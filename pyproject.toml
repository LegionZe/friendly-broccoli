[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtrpg-manager"
version = "0.1.0"
description = "Local library manager for a DriveThruRPG account: sync, categorise, download, and get random game suggestions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dtrpg-manager = "dtrpg_manager.cli:main"

[tool.setuptools.packages.find]
include = ["dtrpg_manager*"]

[tool.setuptools.package-data]
dtrpg_manager = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
